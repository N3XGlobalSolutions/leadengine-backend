[project]
name = "aob-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "argon2-cffi>=23.1.0",
    "argon2-cffi-bindings>=25.1.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.14.2",
    "boto3>=1.42.4",
    "boto3-stubs~=1.42.4",
    "fastapi[standard]>=0.122.0",
    "google-generativeai>=0.8.5",
    "httpx>=0.28.1",
    "langchain>=1.1.2",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.4",
    "lxml>=6.0.2",
    "mangum>=0.20.0",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.7.4",
    "phonenumbers>=9.0.30",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "pymongo>=4.15.4",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.16.1,<1.17.0",  # Pinned: server runs 1.16.3, client must be <=1 minor version ahead
    "redis>=7.4.0",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.1",  # for FastAPI TestClient
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# Only collect real unit/integration tests, not the load/stress scripts.
python_files = ["test_*.py"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that touch external services",
]
asyncio_mode = "auto"
